<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FM Glass Comb Resonator</title>

<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>

<style>
html,body{
  margin:0;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#050507;
}
button{
  padding:18px 36px;
  font-size:16px;
  border:none;
  cursor:pointer;
  background:#fff;
}
</style>
</head>

<body>

<button id="play">PLAY</button>

<script>

let synth;
let comb;
let reverb;
let transient;
let limiter;
let started = false;
let stopTimer;

const NOTES = ["C2","G2","C3","G3"];

async function initAudio() {

  await Tone.start();

  limiter = new Tone.Limiter(-1).toDestination();

  reverb = new Tone.Reverb({
    decay: 8,
    wet: 0.55
  }).connect(limiter);

  comb = new Tone.FeedbackCombFilter({
    delayTime: 0.003,
    resonance: 0.6
  }).connect(reverb);

  synth = new Tone.PolySynth(Tone.FMSynth, {
    harmonicity: 2,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    modulation: { type: "triangle" },
    envelope: {
      attack: 0.005,
      decay: 0.2,
      sustain: 1,
      release: 5
    },
    modulationEnvelope: {
      attack: 0.01,
      decay: 0.2,
      sustain: 1,
      release: 5
    }
  });

  synth.volume.value = -10;
  synth.connect(comb);

  synth.voices.forEach((v,i)=>{
    v.detune.value = [-4,2,-1,5][i];
    v.harmonicity.value = [2,3,4,5][i];
    v.modulationIndex.value = [6,8,10,12][i];
  });

  transient = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: {
      attack: 0.0001,
      decay: 0.03,
      sustain: 0,
      release: 0.01
    }
  });

  const hp = new Tone.Filter({
    type: "highpass",
    frequency: 7000
  });

  transient.connect(hp);
  hp.connect(reverb);

  started = true;
}

function stopAll() {

  if(stopTimer) clearTimeout(stopTimer);

  if(!synth) return;

  const t = Tone.now();

  synth.releaseAll(t);

  comb.resonance.cancelScheduledValues(t);
  reverb.wet.cancelScheduledValues(t);
}

function playSound() {

  stopAll();

  const t = Tone.now();

  transient.triggerAttackRelease(0.03, t);

  synth.triggerAttack(NOTES, t, 0.9);

  comb.resonance.setValueAtTime(0.4, t);
  comb.resonance.linearRampToValueAtTime(0.95, t + 2);
  comb.resonance.linearRampToValueAtTime(0.02, t + 3);

  synth.voices.forEach((v,i)=>{
    v.modulationIndex.cancelScheduledValues(t);
    v.modulationIndex.setValueAtTime([6,8,10,12][i], t);
    v.modulationIndex.linearRampToValueAtTime(22, t + 3);
  });

  synth.volume.setValueAtTime(-12, t);
  synth.volume.linearRampToValueAtTime(-2, t + 2.8);

  synth.triggerRelease(NOTES, t + 3);

  reverb.wet.setValueAtTime(0.55, t);
  reverb.wet.linearRampToValueAtTime(0.9, t + 4);

  stopTimer = setTimeout(()=>{
    synth.releaseAll();
  }, 10000);
}

document.getElementById("play").addEventListener("click", async () => {
  if(!started){
    await initAudio();
  }
  playSound();
});

</script>

</body>
</html>
