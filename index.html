<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Glass Comb Resonator</title>

<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #050507;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

button {
    padding: 18px 36px;
    font-size: 16px;
    border: none;
    cursor: pointer;
    background: white;
    color: black;
}
</style>
</head>

<body>

<button id="playButton">PLAY</button>

<script>

let synth;
let comb;
let reverb;
let dryGain;
let wetGain;
let transient;
let initialized = false;
let stopTimeout = null;

const NOTES = ["C2", "G2", "C3", "G3"];

async function initializeAudio() {

    await Tone.start();

    // DRY PATH
    dryGain = new Tone.Gain(0.8).toDestination();

    // WET PATH
    wetGain = new Tone.Gain(0.7).toDestination();

    reverb = new Tone.Reverb({
        decay: 8,
        wet: 1
    });

    comb = new Tone.FeedbackCombFilter({
        delayTime: 0.003,
        resonance: 0.65
    });

    comb.connect(reverb);
    reverb.connect(wetGain);

    // STRICT POLYSYNTH
    synth = new Tone.PolySynth(Tone.FMSynth, {
        harmonicity: 2,
        modulationIndex: 10,
        oscillator: {
            type: "sine"
        },
        modulation: {
            type: "triangle"
        },
        envelope: {
            attack: 0.005,
            decay: 0.2,
            sustain: 1,
            release: 5
        },
        modulationEnvelope: {
            attack: 0.01,
            decay: 0.2,
            sustain: 1,
            release: 5
        }
    });

    synth.volume.value = -8;

    // SPLIT ROUTING
    synth.connect(dryGain);
    synth.connect(comb);

    // TRANSIENT
    transient = new Tone.NoiseSynth({
        noise: {
            type: "white"
        },
        envelope: {
            attack: 0.0001,
            decay: 0.03,
            sustain: 0,
            release: 0.01
        }
    });

    const highpass = new Tone.Filter({
        type: "highpass",
        frequency: 8000
    });

    transient.connect(highpass);
    highpass.connect(wetGain);

    initialized = true;
}

function stopPlayback() {

    if (stopTimeout) {
        clearTimeout(stopTimeout);
    }

    if (!synth) return;

    synth.releaseAll();

    const now = Tone.now();

    comb.resonance.cancelScheduledValues(now);
    dryGain.gain.cancelScheduledValues(now);
    wetGain.gain.cancelScheduledValues(now);
}

function playSound() {

    stopPlayback();

    const t = Tone.now();

    // RESET LEVELS
    dryGain.gain.setValueAtTime(0.8, t);
    wetGain.gain.setValueAtTime(0.7, t);

    // INITIAL TRANSIENT
    transient.triggerAttackRelease(0.03, t);

    // FM CHORD
    synth.triggerAttack(NOTES, t, 0.9);

    // COMB EVOLUTION
    comb.resonance.setValueAtTime(0.35, t);
    comb.resonance.linearRampToValueAtTime(0.72, t + 2);
    comb.resonance.linearRampToValueAtTime(0.05, t + 3);

    // GLOBAL FM ENERGY
    synth.volume.setValueAtTime(-10, t);
    synth.volume.linearRampToValueAtTime(-2, t + 2.8);

    // FM COLLAPSE
    synth.triggerRelease(NOTES, t + 3);

    // FINAL FADE
    dryGain.gain.setValueAtTime(0.8, t + 8);
    dryGain.gain.linearRampToValueAtTime(0, t + 10);

    wetGain.gain.setValueAtTime(0.7, t + 8);
    wetGain.gain.linearRampToValueAtTime(0, t + 10);

    stopTimeout = setTimeout(() => {
        synth.releaseAll();
    }, 10000);
}

document.getElementById("playButton").addEventListener("click", async () => {

    if (!initialized) {
        await initializeAudio();
    }

    playSound();

});

</script>

</body>
</html>
