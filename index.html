<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FM Glass Comb Resonator</title>

<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050507;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }

  button {
    padding: 18px 36px;
    font-size: 15px;
    border: none;
    cursor: pointer;
    background: white;
    color: black;
  }
</style>
</head>

<body>

<button id="play">PLAY</button>

<script>

let synth;
let comb;
let reverb;
let transient;
let limiter;
let activeTimeout;

const NOTES = ["C2", "G2", "C3", "G3"];

async function buildEngine() {

  await Tone.start();

  // ----------------------------------------------------
  // MASTER LIMITER
  // ----------------------------------------------------

  limiter = new Tone.Limiter(-1).toDestination();

  // ----------------------------------------------------
  // REVERB
  // ----------------------------------------------------

  reverb = new Tone.Reverb({
    decay: 8,
    wet: 0.6
  });

  reverb.connect(limiter);

  // ----------------------------------------------------
  // COMB FILTER
  // ----------------------------------------------------

  comb = new Tone.FeedbackCombFilter({
    delayTime: 0.0032,
    resonance: 0.55
  });

  comb.connect(reverb);

  // ----------------------------------------------------
  // FM SYNTH
  // ----------------------------------------------------

  synth = new Tone.PolySynth(Tone.FMSynth, {
    maxPolyphony: 4,

    harmonicity: 2,

    modulationIndex: 6,

    oscillator: {
      type: "sine"
    },

    modulation: {
      type: "triangle"
    },

    envelope: {
      attack: 0.001,
      decay: 0.3,
      sustain: 1,
      release: 2
    },

    modulationEnvelope: {
      attack: 0.01,
      decay: 0.2,
      sustain: 1,
      release: 2
    }

  });

  synth.volume.value = -10;

  synth.connect(comb);

  // ----------------------------------------------------
  // VOICE DIFFERENTIATION
  // ----------------------------------------------------

  synth.voices.forEach((voice, i) => {

    voice.detune.value = i * 2;

    voice.harmonicity.value =
      [2, 3, 4, 5][i];

    voice.modulationIndex.value =
      [6, 8, 10, 12][i];

  });

  // ----------------------------------------------------
  // TRANSIENT
  // ----------------------------------------------------

  transient = new Tone.NoiseSynth({

    noise: {
      type: "white"
    },

    envelope: {
      attack: 0.0001,
      decay: 0.025,
      sustain: 0,
      release: 0.01
    }

  });

  const transientHPF = new Tone.Filter({
    type: "highpass",
    frequency: 6500,
    Q: 1
  });

  transient.chain(transientHPF, reverb);

}

function stopPlayback() {

  if (activeTimeout) {
    clearTimeout(activeTimeout);
  }

  Tone.Transport.stop();
  Tone.Transport.cancel();

  if (synth) {
    synth.releaseAll();
  }

  if (comb) {
    comb.resonance.cancelScheduledValues(Tone.now());
  }

  if (reverb) {
    reverb.wet.cancelScheduledValues(Tone.now());
  }

}

function playSystem() {

  stopPlayback();

  const now = Tone.now();

  // ----------------------------------------------------
  // TRANSIENT HIT
  // ----------------------------------------------------

  transient.triggerAttackRelease(
    "0.02",
    now,
    0.6
  );

  // ----------------------------------------------------
  // FM CHORD START
  // ----------------------------------------------------

  synth.triggerAttack(
    NOTES,
    now,
    0.9
  );

  // ----------------------------------------------------
  // 0–2s COMB OPENING
  // ----------------------------------------------------

  comb.resonance.setValueAtTime(
    0.45,
    now
  );

  comb.resonance.linearRampToValueAtTime(
    0.96,
    now + 2
  );

  // ----------------------------------------------------
  // FM EVOLUTION
  // ----------------------------------------------------

  synth.voices.forEach((voice, i) => {

    voice.modulationIndex.cancelScheduledValues(now);

    voice.modulationIndex.setValueAtTime(
      6 + i,
      now
    );

    voice.modulationIndex.linearRampToValueAtTime(
      22,
      now + 3
    );

  });

  // ----------------------------------------------------
  // GLOBAL BRIGHTNESS BUILD
  // ----------------------------------------------------

  synth.volume.setValueAtTime(
    -12,
    now
  );

  synth.volume.linearRampToValueAtTime(
    -4,
    now + 2.8
  );

  // ----------------------------------------------------
  // SECOND 3 COLLAPSE
  // ----------------------------------------------------

  comb.resonance.linearRampToValueAtTime(
    0.02,
    now + 3
  );

  // FM BODY REMOVED
  synth.triggerRelease(
    NOTES,
    now + 3
  );

  // ----------------------------------------------------
  // REVERB RESIDUAL PHASE
  // ----------------------------------------------------

  reverb.wet.setValueAtTime(
    0.6,
    now
  );

  reverb.wet.linearRampToValueAtTime(
    0.92,
    now + 4
  );

  // ----------------------------------------------------
  // 8–10s FINAL FADE
  // ----------------------------------------------------

  reverb.wet.linearRampToValueAtTime(
    0,
    now + 10
  );

  // ----------------------------------------------------
  // HARD STOP
  // ----------------------------------------------------

  activeTimeout = setTimeout(() => {

    synth.releaseAll();

  }, 10000);

}

document.getElementById("play")
.addEventListener("click", async () => {

  if (!synth) {
    await buildEngine();
  }

  playSystem();

});

</script>

</body>
</html>
